name: Build Miuix Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 21 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Release APK Derle
        run: |
          chmod +x gradlew
          if [ -d "example/android" ]; then
            ./gradlew :example:android:assembleRelease
          else
            ./gradlew :example:assembleRelease
          fi

      - name: APK Imzala (Kurulabilmesi Icin)
        run: |
          APK_PATH=$(find example -name "*release*.apk" | head -n 1)
          keytool -genkey -v -keystore test.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Test"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 "$APK_PATH" aligned.apk
          $BUILD_TOOLS/apksigner sign --ks test.keystore --ks-pass pass:123456 --key-pass pass:123456 --out miuix-release-signed.apk aligned.apk

      - name: Imzali Release APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: miuix-release-apk
          path: "miuix-release-signed.apk"
