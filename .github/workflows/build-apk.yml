name: Build Miuix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 21 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sadece Android Demo APK Derle
        run: |
          chmod +x gradlew
          if [ -d "example/android" ]; then
            ./gradlew :example:android:assembleDebug
          else
            ./gradlew :example:assembleDebug
          fi

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: miuix-demo-apk
          path: "example/**/build/outputs/apk/debug/*.apk"
