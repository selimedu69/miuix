name: Build Miuix Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 21 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test Imzasi Olustur
        run: |
          keytool -genkey -v -keystore test.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Test"

      - name: Imzali Release APK Derle
        run: |
          chmod +x gradlew
          ./gradlew :example:android:assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/test.keystore" \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=test \
            -Pandroid.injected.signing.key.password=123456

      - name: Imzali Release APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: miuix-release-apk
          path: "example/android/build/outputs/apk/release/*.apk"
